<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protected Page</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafaf9;--surface:#ffffff;--border:#e7e5e4;--border-hover:#d6d3d1;--accent:#334155;--accent-light:#f1f5f9;--text:#1e293b;--text-secondary:#64748b;--text-tertiary:#94a3b8;--error:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 36px;width:90%;max-width:400px;text-align:center;animation:fadeIn .4s ease}
.icon{width:56px;height:56px;margin:0 auto 24px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.icon svg{width:26px;height:26px}
h2{font-size:20px;color:var(--text);margin-bottom:6px;font-weight:700}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.5}
input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;transition:border .2s,box-shadow .2s;background:var(--bg);color:var(--text);margin-bottom:14px}
input::placeholder{color:var(--text-tertiary)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,65,85,.08)}
button{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
button:hover{opacity:.9}
button:active{transform:scale(.98)}
.err{color:var(--error);font-size:13px;margin-top:14px;display:none}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:10;background:var(--bg)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
.topnav{position:sticky;top:0;z-index:100;display:none;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topnav-inner{display:flex;align-items:center;gap:16px;max-width:1200px;margin:0 auto;padding:0 32px;height:56px}
.topnav-brand{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.topnav-brand svg{width:22px;height:22px;color:var(--accent)}
.nav-tabs{display:flex;gap:4px;flex:1;justify-content:center}
.nav-tab{padding:6px 14px;font-size:12px;font-weight:500;color:var(--text-secondary);border-radius:20px;cursor:pointer;transition:all .2s;border:none;background:none;white-space:nowrap;text-decoration:none}
.nav-tab:hover{background:var(--accent-light);color:var(--text)}
.nav-tab.active{background:var(--accent);color:#fff}
.topnav-back{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .2s;text-decoration:none;background:var(--surface);white-space:nowrap}
.topnav-back:hover{background:var(--accent-light);color:var(--text);border-color:var(--border-hover)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.nav-tabs{display:none}}
</style>
</head>
<body>
<div class="loading" id="ld"><div class="spinner"></div></div>
<nav class="topnav" id="topnav"><div class="topnav-inner"><a class="topnav-brand" id="navHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>CaDA Knowledge Hub</a><div class="nav-tabs" id="navTabs"><a class="nav-tab active" href="./" data-cat="all">全部</a><a class="nav-tab" href="./#project_approval" data-cat="project_approval">立项论证</a><a class="nav-tab" href="./#product_planning" data-cat="product_planning">产品规划</a><a class="nav-tab" href="./#strategic_path" data-cat="strategic_path">战略路径</a><a class="nav-tab" href="./#industry_analysis" data-cat="industry_analysis">行业分析</a><a class="nav-tab" href="./#others" data-cat="others">其他</a></div><a class="topnav-back" id="navBack"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>返回首页</a></div></nav>
<div id="wrap">
<div class="card" id="p" style="display:none">
<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
<h2>此页面已加密</h2>
<p class="sub">请输入密码查看内容</p>
<input type="password" id="pw" placeholder="输入密码" autofocus>
<button onclick="dec()">查看内容</button>
<div class="err" id="e">密码错误，请重试</div>
</div>
</div>
<iframe id="f" style="display:none;border:none;width:100vw;height:100vh;position:fixed;top:0;left:0"></iframe>
<script>
const IV="xfb3kASsgh6hPxrs",S="jhHV1DJJuvIkZ99bNYi8eg==";
async function getD(){try{const r=await fetch(location.pathname+".data");if(!r.ok)return null;return await r.arrayBuffer()}catch(e){return null}}
async function dk(p){const e=new TextEncoder(),km=await crypto.subtle.importKey("raw",e.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:Uint8Array.from(atob(S),c=>c.charCodeAt(0)),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"])}
const PK="site_pwd_"+location.pathname;async function tryDec(p){try{const k=await dk(p),buf=await getD();if(!buf)throw 0;const ivn=Uint8Array.from(atob(IV),c=>c.charCodeAt(0)),r=await crypto.subtle.decrypt({name:"AES-GCM",iv:ivn},k,buf),h=new TextDecoder().decode(r);sessionStorage.setItem(PK,p);document.body.style.display="block";document.getElementById("ld").style.display="none";document.getElementById("wrap").style.display="none";document.getElementById("topnav").style.display="block";var home=location.pathname.split("/pages/")[0]+"/";document.getElementById("navHome").href=home;document.getElementById("navBack").href=home;document.querySelectorAll(".nav-tab").forEach(function(t){var c=t.dataset.cat;t.href=c==="all"?home:home+"#"+c;});var f=document.getElementById("f");f.style.display="block";f.style.top="56px";f.style.height="calc(100vh - 56px)";var u=URL.createObjectURL(new Blob([h],{type:"text/html"}));f.src=u;return true}catch{return false}}
async function dec(){const p=document.getElementById("pw").value;if(!p)return;if(!(await tryDec(p))){document.getElementById("e").style.display="block";document.getElementById("pw").value=""}}
document.getElementById("pw").addEventListener("keydown",function(x){if(x.key==="Enter")dec()});
document.getElementById("f").addEventListener("load",function(){try{var doc=this.contentDocument;doc.addEventListener("click",function(e){var a=e.target.closest("a");if(a){var hr=a.getAttribute("href");if(hr&&hr.charAt(0)==="#"){e.preventDefault();var el=doc.getElementById(hr.slice(1));if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}}});if(this.contentWindow.location.hash){var el=doc.getElementById(this.contentWindow.location.hash.slice(1));if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}}catch(e){}});
(async function(){try{var hp=new URLSearchParams(location.hash.slice(1)).get("pwd");if(hp){history.replaceState(null,"",location.pathname+location.search);if(await tryDec(decodeURIComponent(hp)))return}var sp=sessionStorage.getItem(PK);if(sp&&await tryDec(sp))return}catch(e){}document.getElementById("ld").style.display="none";document.getElementById("p").style.display=""})();
</script>
</body>
</html>
