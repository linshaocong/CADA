<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>My Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafaf9;--surface:#ffffff;--border:#e7e5e4;--border-hover:#d6d3d1;--accent:#4f46e5;--accent-light:#eef2ff;--text:#1c1917;--text-secondary:#78716c;--text-tertiary:#a8a29e;--radius:12px}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.page{max-width:680px;margin:0 auto;padding:0 24px}
header{padding:80px 0 48px;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.avatar svg{width:32px;height:32px;color:#fff}
header h1{font-family:'Noto Serif SC','Inter',serif;font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
header p{font-size:15px;color:var(--text-secondary);margin-top:8px;line-height:1.6}
header .divider{width:40px;height:3px;background:var(--accent);border-radius:2px;margin:24px auto 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-label{font-size:12px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:1.2px}
.section-count{font-size:12px;color:var(--text-tertiary)}
.posts{display:flex;flex-direction:column;gap:6px;padding-bottom:80px}
.post-card{display:flex;align-items:center;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:inherit;transition:all .2s ease;opacity:0;animation:fadeIn .35s ease forwards}
.post-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(79,70,229,.08);transform:translateY(-1px)}
.post-index{font-size:13px;font-weight:600;color:var(--text-tertiary);width:32px;flex-shrink:0;font-variant-numeric:tabular-nums}
.post-body{flex:1;min-width:0}
.post-title{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-meta{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.post-arrow{color:var(--text-tertiary);flex-shrink:0;margin-left:12px;transition:transform .2s,color .2s}
.post-card:hover .post-arrow{transform:translateX(2px);color:var(--accent)}
.empty{text-align:center;padding:72px 24px;color:var(--text-tertiary);font-size:14px}
.empty-icon{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent)}
footer{text-align:center;padding:32px 0 48px;font-size:11px;color:var(--text-tertiary);letter-spacing:.3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="page">

    </div>
