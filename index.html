<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>文件目录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a1a;--card:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.08);--border:rgba(255,255,255,.06);--accent:#818cf8;--accent-glow:rgba(129,140,248,.25);--text:#e2e8f0;--text-dim:#64748b;--text-bright:#f8fafc}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(99,102,241,.12) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(139,92,246,.08) 0%,transparent 50%);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 20px}
.hero{padding:72px 0 48px;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:100px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--accent);letter-spacing:.5px;margin-bottom:24px}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:700;color:var(--text-bright);line-height:1.2;letter-spacing:-.02em}
.hero p{font-size:15px;color:var(--text-dim);margin-top:12px;line-height:1.6}
.hero-line{width:48px;height:3px;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:2px;margin:28px auto 0}
.section-label{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;padding:0 4px;margin-bottom:16px}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
.card{display:flex;align-items:center;padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;text-decoration:none;color:inherit;transition:all .25s cubic-bezier(.4,0,.2,1);opacity:0;animation:fadeUp .4s ease forwards}
.card:hover{background:var(--card-hover);border-color:rgba(129,140,248,.2);transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 0 1px rgba(129,140,248,.1)}
.card-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.15));display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.card-body{flex:1;margin-left:16px;min-width:0}
.card-title{font-size:15px;font-weight:600;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:12px;color:var(--text-dim);margin-top:3px}
.card-arrow{color:var(--text-dim);flex-shrink:0;margin-left:12px;transition:transform .2s,color .2s}
.card:hover .card-arrow{transform:translateX(3px);color:var(--accent)}
.empty{text-align:center;padding:64px 24px;color:var(--text-dim);font-size:14px}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.footer{text-align:center;padding:32px 0 48px;font-size:11px;color:var(--text-dim);opacity:.5;letter-spacing:.5px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
