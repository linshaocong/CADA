<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>CaDA Knowledge Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f4;--surface:#ffffff;--border:#e7e5e4;--border-hover:#d6d3d1;--accent:#334155;--accent-light:#f1f5f9;--text:#1e293b;--text-secondary:#64748b;--text-tertiary:#94a3b8;--radius:14px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);--shadow-hover:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#fafaf9 0%,#f5f5f4 100%);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:1200px;margin:0 auto;padding:0 32px}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 32px;height:60px}
.nav-brand{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.nav-brand svg{width:24px;height:24px;color:var(--accent)}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:7px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);border-radius:20px;cursor:pointer;transition:all .2s;border:none;background:none;white-space:nowrap}
.nav-tab:hover{background:var(--accent-light);color:var(--text)}
.nav-tab.active{background:var(--accent);color:#fff}

/* Banner */
.banner{padding:56px 0 40px;text-align:center}
.banner h1{font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--text);margin-bottom:10px}
.banner p{font-size:16px;color:var(--text-secondary);line-height:1.6;max-width:440px;margin:0 auto 28px}
.search-box{position:relative;max-width:480px;margin:0 auto}
.search-box input{width:100%;padding:13px 20px 13px 44px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s;background:var(--surface);color:var(--text)}
.search-box input::placeholder{color:var(--text-tertiary)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,65,85,.08)}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-tertiary)}

/* Section */
.section{margin-bottom:48px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.section-label{font-size:13px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:1px}
.section-line{flex:1;height:1px;background:var(--border)}

/* Featured */
.featured-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;height:420px}
.featured-main{grid-row:1/3}
.featured-card{position:relative;border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;transition:all .25s ease;border:1px solid var(--border);opacity:0;animation:cardIn .4s ease forwards}
.featured-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border-hover)}
.featured-cover{width:100%;height:100%;object-fit:cover;display:block}
.featured-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.featured-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,.1) 50%,transparent 100%);padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.featured-tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-bottom:10px;width:fit-content}
.featured-title{font-size:18px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-main .featured-title{font-size:22px}
.featured-meta{font-size:12px;color:rgba(255,255,255,.7)}

/* Article grid */
.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.article-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;transition:all .25s ease;opacity:0;animation:cardIn .4s ease forwards;display:flex;flex-direction:column}
.article-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border-hover)}
.article-cover-wrap{position:relative;width:100%;padding-top:56.25%;overflow:hidden}
.article-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.article-card:hover .article-cover{transform:scale(1.03)}
.article-cover-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.article-body{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column}
.article-tag{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;margin-bottom:10px;width:fit-content}
.article-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article-desc{font-size:13px;color:var(--text-secondary);line-height:1.55;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.article-footer{display:flex;align-items:center;justify-content:space-between}
.article-date{font-size:12px;color:var(--text-tertiary)}
.article-arrow{width:28px;height:28px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--accent)}
.article-card:hover .article-arrow{background:var(--accent);color:#fff}

/* Empty */
.empty-state{text-align:center;padding:80px 24px}
.empty-state svg{width:48px;height:48px;color:var(--text-tertiary);margin-bottom:16px}
.empty-state p{font-size:15px;color:var(--text-secondary)}

/* Footer */
.footer{text-align:center;padding:48px 0 56px;border-top:1px solid var(--border);margin-top:32px}
.footer p{font-size:14px;color:var(--text-tertiary);letter-spacing:.3px;line-height:1.6}

/* Animations */
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:1024px){.article-grid{grid-template-columns:repeat(2,1fr)}.featured-grid{height:360px}}
@media(max-width:768px){.nav-tabs{display:none}.banner h1{font-size:26px}.featured-grid{grid-template-columns:1fr;grid-template-rows:auto;height:auto}.featured-main{grid-row:auto}.featured-grid .featured-card{height:220px}.article-grid{grid-template-columns:1fr}.container{padding:0 20px}}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      CaDA Knowledge Hub
    </div>
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-cat="all">全部</button>
      <button class="nav-tab" data-cat="project_review">项目复盘</button>
      <button class="nav-tab" data-cat="industry_news">行业资讯</button>
      <button class="nav-tab" data-cat="product_research">产品研究</button>
      <button class="nav-tab" data-cat="design_inspiration">设计灵感</button>
      <button class="nav-tab" data-cat="work_method">工作方法</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="banner">
    <h1>内部知识分享中心</h1>
    <p>沉淀项目经验，分享行业洞察，连接每一个有价值的想法。</p>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="搜索文章、关键词或作者">
    </div>
  </div>

  <div id="featuredSection" class="section">
    <div class="section-head">
      <span class="section-label">★ 精选推荐</span>
      <div class="section-line"></div>
    </div>
    <div class="featured-grid" id="featuredGrid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-label" id="listLabel">全部文章</span>
      <div class="section-line"></div>
    </div>
    <div class="article-grid" id="articleGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>
      <p>暂无相关文章，试试切换其他分类。</p>
    </div>
  </div>
</div>

<footer class="footer">
  <p>让每一次经验，都成为下一次效率提升的起点。</p>
</footer>

<script>
const ITEMS = [{"siteName":"项目论证-日本画境","shareUrl":"https://linshaocong.github.io/CADA/pages/yb3nnw445eos871wfzzqw/项目论证-日本画境.html","createdAt":"2026/6/4","category":"project_review","description":"","coverUrl":""},{"siteName":"产品规划-CaDA生活艺术家","shareUrl":"https://linshaocong.github.io/CADA/pages/jd6t6cxogo8ywmddw08b2/产品规划-CaDA生活艺术家.html","createdAt":"2026/6/4","category":"project_review","description":"","coverUrl":""},{"siteName":"战略路径-中式花卉积木竞争格局","shareUrl":"https://linshaocong.github.io/CADA/pages/4y4s82psmsgsf1bv1mf57/战略路径-中式花卉积木竞争格局.html","createdAt":"2026/6/4","category":"project_review","description":"","coverUrl":""},{"siteName":"LEGO-Botanical系列信息整理","shareUrl":"https://linshaocong.github.io/CADA/pages/ua0616afynjoxgimn6ukob/LEGO-Botanical系列信息整理.html","createdAt":"2026/6/4","category":"project_review","description":"","coverUrl":""}];
const CATEGORIES = {"project_review":"项目复盘","industry_news":"行业资讯","product_research":"产品研究","design_inspiration":"设计灵感","work_method":"工作方法"};
const FEATURED_COVERS = ["https://miaoda.feishu.cn/aily/api/v1/files/static/c3987e3927944a67b5c6433fe29349e8_ve_miaoda","https://miaoda.feishu.cn/aily/api/v1/files/static/3a6a2da5de634830946dd337345ef1ab_ve_miaoda","https://miaoda.feishu.cn/aily/api/v1/files/static/0e05b52d578241a3b9cdfebdd3b87b3f_ve_miaoda"];
const LIST_DEFAULT_COVER = "https://miaoda.feishu.cn/aily/api/v1/files/static/582989b7f8f5460b83ebea88352f89e5_ve_miaoda";
const GRADIENTS = {"project_review":"linear-gradient(135deg, #667eea, #764ba2)","industry_news":"linear-gradient(135deg, #f093fb, #f5576c)","product_research":"linear-gradient(135deg, #4facfe, #00f2fe)","design_inspiration":"linear-gradient(135deg, #43e97b, #38f9d7)","work_method":"linear-gradient(135deg, #fa709a, #fee140)"};
const TAG_BG = {"project_review":"#e0e7ff","industry_news":"#dbeafe","product_research":"#dcfce7","design_inspiration":"#fae8ff","work_method":"#fef3c7"};
const TAG_COLOR = {"project_review":"#3730a3","industry_news":"#1e40af","product_research":"#166534","design_inspiration":"#86198f","work_method":"#92400e"};

let currentCat = 'all';
let searchQuery = '';

function getCatLabel(cat) { return CATEGORIES[cat] || cat; }
function getTagStyle(cat) { return 'background:' + (TAG_BG[cat]||'#f1f5f9') + ';color:' + (TAG_COLOR[cat]||'#334155'); }
function getGradient(cat) { return GRADIENTS[cat] || 'linear-gradient(135deg,#94a3b8,#64748b)'; }

function coverImg(url, cat, isPlaceholder) {
  if (url) return '<img class="' + (isPlaceholder ? 'featured-cover' : 'article-cover') + '" src="' + url + '" alt="" loading="lazy">';
  return '<div class="' + (isPlaceholder ? 'featured-cover-placeholder' : 'article-cover-placeholder') + '" style="background:' + getGradient(cat) + '"></div>';
}

function getFiltered() {
  return ITEMS.filter(function(item) {
    var catOk = currentCat === 'all' || item.category === currentCat;
    var q = searchQuery.toLowerCase();
    var searchOk = !q || item.siteName.toLowerCase().indexOf(q) !== -1 || (item.description && item.description.toLowerCase().indexOf(q) !== -1);
    return catOk && searchOk;
  });
}

function renderFeatured(items) {
  var section = document.getElementById('featuredSection');
  var grid = document.getElementById('featuredGrid');
  if (currentCat !== 'all' || items.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  var featured = items.slice(0, 3);
  var html = '';
  featured.forEach(function(item, i) {
    var coverUrl = item.coverUrl || FEATURED_COVERS[i] || '';
    var isMain = i === 0;
    html += '<a href="' + item.shareUrl + '" target="_top" class="featured-card' + (isMain ? ' featured-main' : '') + '" style="animation-delay:' + (i * 100) + 'ms">';
    html += coverImg(coverUrl, item.category, true);
    html += '<div class="featured-overlay">';
    html += '<span class="featured-tag" style="' + getTagStyle(item.category) + '">' + getCatLabel(item.category) + '</span>';
    html += '<div class="featured-title">' + item.siteName + '</div>';
    html += '<div class="featured-meta">' + item.createdAt + '</div>';
    html += '</div></a>';
  });
  grid.innerHTML = html;
}

function renderList(items) {
  var grid = document.getElementById('articleGrid');
  var empty = document.getElementById('emptyState');
  var label = document.getElementById('listLabel');
  var list = currentCat === 'all' ? items.slice(3) : items;
  label.textContent = currentCat === 'all' ? '全部文章' : getCatLabel(currentCat);
  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  var html = '';
  list.forEach(function(item, i) {
    var coverUrl = item.coverUrl || LIST_DEFAULT_COVER;
    html += '<a href="' + item.shareUrl + '" target="_top" class="article-card" style="animation-delay:' + (i * 60) + 'ms">';
    html += '<div class="article-cover-wrap">';
    html += coverImg(coverUrl, item.category, false);
    html += '</div>';
    html += '<div class="article-body">';
    html += '<span class="article-tag" style="' + getTagStyle(item.category) + '">' + getCatLabel(item.category) + '</span>';
    html += '<div class="article-title">' + item.siteName + '</div>';
    if (item.description) html += '<div class="article-desc">' + item.description + '</div>';
    html += '<div class="article-footer"><span class="article-date">' + item.createdAt + '</span>';
    html += '<span class="article-arrow"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span></div>';
    html += '</div></a>';
  });
  grid.innerHTML = html;
}

function render() {
  var filtered = getFiltered();
  renderFeatured(filtered);
  renderList(filtered);
}

/* Tab click */
document.getElementById('navTabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.nav-tab');
  if (!tab) return;
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  tab.classList.add('active');
  currentCat = tab.dataset.cat;
  render();
});

/* Search */
var searchTimer = null;
document.getElementById('searchInput').addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchQuery = e.target.value.trim();
    render();
  }, 200);
});

/* Init */
render();
</script>
</body>
</html>
