<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafaf9;--surface:#ffffff;--border:#e7e5e4;--border-hover:#d6d3d1;--accent:#334155;--accent-light:#f1f5f9;--text:#1e293b;--text-secondary:#64748b;--text-tertiary:#94a3b8;--error:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 36px;width:90%;max-width:400px;text-align:center;animation:fadeIn .4s ease}
.icon{width:56px;height:56px;margin:0 auto 24px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.icon svg{width:26px;height:26px}
h2{font-size:20px;color:var(--text);margin-bottom:6px;font-weight:700}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.5}
input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;transition:border .2s,box-shadow .2s;background:var(--bg);color:var(--text);margin-bottom:14px}
input::placeholder{color:var(--text-tertiary)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,65,85,.08)}
button{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
button:hover{opacity:.9}
button:active{transform:scale(.98)}
.err{color:var(--error);font-size:13px;margin-top:14px;display:none}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:10;background:var(--bg)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
.topnav{position:sticky;top:0;z-index:100;display:none;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topnav-inner{display:flex;align-items:center;gap:16px;max-width:1200px;margin:0 auto;padding:0 32px;height:56px}
.topnav-brand{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.topnav-brand svg{width:22px;height:22px;color:var(--accent)}
.nav-tabs{display:flex;gap:4px;flex:1;justify-content:center}
.nav-tab{padding:6px 14px;font-size:12px;font-weight:500;color:var(--text-secondary);border-radius:20px;cursor:pointer;transition:all .2s;border:none;background:none;white-space:nowrap;text-decoration:none}
.nav-tab:hover{background:var(--accent-light);color:var(--text)}
.nav-tab.active{background:var(--accent);color:#fff}
.topnav-back{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .2s;text-decoration:none;background:var(--surface);white-space:nowrap}
.topnav-back:hover{background:var(--accent-light);color:var(--text);border-color:var(--border-hover)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.nav-tabs{display:none}}
</style>
</head>
